[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-cmev"
version = "0.1.0"
description = "CLAIM-CMEV fixture-backed surveyor platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.7,<3",
    "pillow>=11,<13",
    "pypdf>=5,<7",
    "boto3>=1.36,<2",
    "kafka-python>=2.2,<3",
    "numpy>=2.0,<3",
    "alembic>=1.14,<2",
    "pypdfium2>=4.30,<5",
    "opencv-python-headless>=4.10,<5",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
    "lightgbm>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
# The M1 parts worker and the vision training scripts; no other service imports these.
# transformers 5 renamed SegFormer's decode-head layers, so a checkpoint saved by 5.x does not
# load under 4.x (the worker refuses it). The served checkpoint was saved by 5.17.
vision = ["torch>=2.0", "torchvision>=0.15", "transformers>=5.17,<6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["claim_cmev*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests/backend", "tests/contracts", "tests/unit", "tests/integration"]

[tool.setuptools.package-data]
claim_cmev = ["**/*.json", "**/*.yaml"]
