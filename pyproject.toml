[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-cmev"
version = "0.1.0"
description = "CLAIM-CMEV fixture-backed surveyor platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1", "pillow>=11,<13", "pypdf>=5,<7", "boto3>=1.36,<2", "kafka-python>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["claim_cmev*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
