# Configuration for M1: Vehicle Part Segmentation (SegFormer-B2 Original / Vanilla: Standard CE Loss + Standard Aug)
# Specifications: docs/specs/module-01-vehicle-part-segmentation.md
#                 docs/specs/model_training_specification.md section 7.1

model_id: "parts"
model_version: "parts/0.7.0-b2-original"
taxonomy_version: "parts-1.0.0"
config_version: "parts-cfg-0.7.0"

# Architecture and Training Recipe
architecture: "nvidia/mit-b2"
num_labels: 22
input_size: 512
resize_policy: "longest_edge_pad"

# Training Hyperparameters
batch_size: 4
gradient_accumulation_steps: 4
learning_rate_head: 6.0e-5
learning_rate_encoder: 6.0e-6
weight_decay: 0.01
warmup_steps: 300
num_epochs: 60
early_stopping_patience: 10
seed: 20260922

# Loss Formulation (Vanilla unweighted Cross-Entropy)
loss_type: "ce"
loss_weighting: "none"

# Augmentation Mode (Standard: flip + color jitter)
augment_mode: "standard"

# Serving and Inference Thresholds
device: "cuda"
min_part_pixels: 512
min_part_confidence: 0.50
max_photos_per_job: 20
max_attempts: 3
skip_superseded_revisions: true
write_overlay: true

# Supported Panel List for Coverage
supported_panel_list: "all"
