# Synthetic base prices (SGD) for the eligible part/operation pairs, stated for the
# reference class `sedan_standard` under single_part_pre_tax_no_discount_v1.
# A key's base price is `pair_price x class_multiplier`, rounded once to 2 places
# ROUND_HALF_UP; the expanded per-key table is written into every generator manifest.
# Status: proposed. These are documented synthetic assumptions, not market prices.
