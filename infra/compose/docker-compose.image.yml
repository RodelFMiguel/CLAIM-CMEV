# The real image branch: M1 parts, M2 damage and M3 summary. Add this file to serve the trained models:
#
#   docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.image.yml --profile lean up --build -d
#
# This file is the whole switch. It starts cmev-worker-image with the lean and full profiles and
# tells every service that real workers own the parts, damage and summary stages. The two always
# come together, so the fixture producers are never told to leave a topic while no worker is there
# to take it. Do not add docker-compose.parts.yml as well: that is the M1-only mode.
# Without either file the stack is fixture-only. See infra/README.md.
x-image-real: &image-real
  CMEV_PARTS_PRODUCER: real
  CMEV_DAMAGE_PRODUCER: real

services:
  cmev-api:
    environment: *image-real
  cmev-worker-combined:
    environment: *image-real
  cmev-orchestrator:
    environment: *image-real
  cmev-worker-producers:
    environment: *image-real
  cmev-consolidator:
    environment: *image-real
  cmev-worker-image:
    profiles: [lean, full]
    environment: *image-real
