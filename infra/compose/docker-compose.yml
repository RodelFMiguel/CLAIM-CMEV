name: claim-cmev

# Profiles (technical specification 11.1): `lean` runs one combined worker; `full` runs the
# orchestrator, the fixture stage producers and the consolidator as separate containers
# from the same image. Both use the same handlers, topics and records.
x-app-environment: &app-environment
  CMEV_FIXTURE_MODE: "true"
  CMEV_DATABASE_URL: postgresql+psycopg://cmev:${CMEV_DB_PASSWORD:?Set CMEV_DB_PASSWORD in infra/compose/.env}@cmev-db:5432/cmev
  CMEV_KAFKA_BOOTSTRAP: cmev-kafka:9092
  STORAGE_BACKEND: s3
  CMEV_OBJECT_STORE_ENDPOINT: http://cmev-objectstore:9000
  CMEV_OBJECT_STORE_ACCESS_KEY: ${CMEV_OBJECT_STORE_ACCESS_KEY:?Set object-store access key}
  CMEV_OBJECT_STORE_SECRET_KEY: ${CMEV_OBJECT_STORE_SECRET_KEY:?Set object-store secret key}
  CMEV_OBJECT_STORE_BUCKET: cmev-evidence
  CMEV_MODEL_REGISTRY_PATH: /srv/artifacts/models
  CMEV_COST_TABLE_PATH: /srv/artifacts/cost_tables
  CMEV_ACTIVE_COST_TABLE_VERSION: ${CMEV_ACTIVE_COST_TABLE_VERSION:-}
  DEMO_EMAIL: ${CMEV_DEMO_EMAIL:-surveyor@claim-cmev.demo}
  DEMO_PASSWORD: ${CMEV_DEMO_PASSWORD:?Set local demonstration password}
  COOKIE_SECURE: "false"
  ALLOWED_ORIGINS: http://localhost:${CMEV_WEB_PORT:-8080},http://127.0.0.1:${CMEV_WEB_PORT:-8080}

x-app-image: &app-image
  build:
    context: ../..
    dockerfile: infra/Dockerfile.api
  image: claim-cmev-app:pipeline

x-worker: &worker
  <<: *app-image
  depends_on:
    cmev-api:
      condition: service_healthy
    cmev-kafka:
      condition: service_healthy
    cmev-cost-bootstrap:
      condition: service_completed_successfully
  volumes:
    - cost-tables:/srv/artifacts/cost_tables:ro
  healthcheck:
    test: [CMD, python, -m, claim_cmev.worker, healthcheck]
    interval: 15s
    timeout: 5s
    start_period: 40s
    retries: 4
  networks: [backend]
  restart: unless-stopped

services:
  cmev-web:
    profiles: [lean, full]
    build:
      context: ../..
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:${CMEV_WEB_PORT:-8080}:80"
    depends_on:
      cmev-api:
        condition: service_healthy
    networks: [edge, backend]
    restart: unless-stopped

  # Offline M7 build into a volume that every runtime service mounts read-only. The
  # builder is deterministic; a rerun reuses the published table. Runs to completion once.
  cmev-cost-bootstrap:
    profiles: [lean, full]
    <<: *app-image
    command: [python, -m, claim_cmev.costs.reference.build, --seed, "20260924", --out, /srv/artifacts/cost_tables,
              --config-dir, /srv/configs/costs, --promote]
    volumes:
      - cost-tables:/srv/artifacts/cost_tables
    network_mode: none
    restart: "no"

  cmev-api:
    profiles: [lean, full]
    <<: *app-image
    environment:
      <<: *app-environment
      CMEV_PROFILE: ${CMEV_PROFILE:-lean}
    depends_on:
      cmev-db:
        condition: service_healthy
      cmev-objectstore:
        condition: service_healthy
      cmev-cost-bootstrap:
        condition: service_completed_successfully
    volumes:
      - cost-tables:/srv/artifacts/cost_tables:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    networks: [backend]
    restart: unless-stopped

  cmev-worker-combined:
    profiles: [lean]
    <<: *worker
    command: [python, -m, claim_cmev.worker, run, --role, combined]
    environment:
      <<: *app-environment
      CMEV_PROFILE: lean

  cmev-orchestrator:
    profiles: [full]
    <<: *worker
    command: [python, -m, claim_cmev.worker, run, --role, orchestrator]
    environment:
      <<: *app-environment
      CMEV_PROFILE: full

  cmev-worker-producers:
    profiles: [full]
    <<: *worker
    command: [python, -m, claim_cmev.worker, run, --role, producers]
    environment:
      <<: *app-environment
      CMEV_PROFILE: full

  cmev-consolidator:
    profiles: [full]
    <<: *worker
    command: [python, -m, claim_cmev.worker, run, --role, consolidator]
    environment:
      <<: *app-environment
      CMEV_PROFILE: full

  cmev-kafka:
    profiles: [lean, full]
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - cmev-kafka:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    healthcheck:
      test: [CMD, rpk, cluster, health, --exit-when-healthy, -X, brokers=localhost:9092]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    volumes:
      - kafka-data:/var/lib/redpanda/data
    networks: [backend]
    restart: unless-stopped

  cmev-db:
    profiles: [lean, full]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmev
      POSTGRES_USER: cmev
      POSTGRES_PASSWORD: ${CMEV_DB_PASSWORD:?Set CMEV_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cmev -d cmev"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped

  cmev-objectstore:
    profiles: [lean, full]
    build:
      context: ../..
      dockerfile: infra/Dockerfile.objectstore
    image: claim-cmev-minio:2025-10-15
    environment:
      MINIO_ROOT_USER: ${CMEV_OBJECT_STORE_ACCESS_KEY:?Set object-store access key}
      MINIO_ROOT_PASSWORD: ${CMEV_OBJECT_STORE_SECRET_KEY:?Set object-store secret key}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    volumes:
      - objectstore-data:/data
    networks: [backend]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  kafka-data:
  objectstore-data:
  cost-tables:
