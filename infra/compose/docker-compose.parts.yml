# The real M1 parts worker. Add this file to serve the trained part-segmentation model:
#
#   docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.parts.yml --profile lean up --build -d
#
# This file is the whole switch. It starts cmev-worker-parts with the lean and full profiles
# and tells every service that the model owns the parts stage. The two always come together,
# so the fixture producers are never told to leave the parts topic while no worker is there
# to take it. Without this file the stack is fixture-only. See infra/README.md.
x-parts-real: &parts-real
  CMEV_PARTS_PRODUCER: real

services:
  cmev-api:
    environment: *parts-real
  cmev-worker-combined:
    environment: *parts-real
  cmev-orchestrator:
    environment: *parts-real
  cmev-worker-producers:
    environment: *parts-real
  cmev-consolidator:
    environment: *parts-real
  cmev-worker-parts:
    profiles: [lean, full]
    environment: *parts-real
